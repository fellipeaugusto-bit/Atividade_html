<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faça o seu login</title>

  <link rel="stylesheet" href="atividade.css">
</head>

<body>

  <main class="cartao">
    <h1>Faça o seu login</h1>

    <form>
      <p class="campo">
        <label for="email">Seu e-mail<span class="obrigatorio">*</span></label>
        <input type="email" id="email" name="email" required>
      </p>

      <p class="campo">
        <label for="senha">Sua senha<span class="obrigatorio">*</span></label>
        <input type="password" id="senha" name="senha" required>
      </p>

      <label class="lembrar">
        <input type="checkbox" id="lembrar" name="lembrar">
        Lembrar-me
      </label>

      <button type="submit" class="botao-entrar">ENTRAR</button>

      <p class="esqueci">Esqueceu sua senha? <a href="#">Clique aqui!</a></p>
    </form>

</body>
</html>
